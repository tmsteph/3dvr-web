    <circle cx="256" cy="248" r="145" fill="none" stroke="#7f4b0c" stroke-width="5" opacity="0.56"/>
    <circle cx="256" cy="248" r="123" fill="none" stroke="#ffe989" stroke-width="2" opacity="0.4"/>
    <path d="M132 211c26-76 88-124 162-131" fill="none" stroke="#fffbe4" stroke-width="13" stroke-linecap="round" opacity="0.32"/>
