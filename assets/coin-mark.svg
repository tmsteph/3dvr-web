<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">3dvr gold coin mark</title>
  <desc id="desc">A polished gold 3dvr coin on a transparent background.</desc>
  <defs>
    <radialGradient id="face" cx="31%" cy="23%" r="84%">
      <stop offset="0" stop-color="#fff9cf"/>
      <stop offset="0.16" stop-color="#ffe788"/>
      <stop offset="0.43" stop-color="#f4c247"/>
      <stop offset="0.72" stop-color="#c98818"/>
      <stop offset="1" stop-color="#70420a"/>
    </radialGradient>
    <linearGradient id="rim" x1="116" y1="98" x2="410" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8c9"/>
      <stop offset="0.22" stop-color="#f7d45f"/>
      <stop offset="0.58" stop-color="#c58315"/>
      <stop offset="0.82" stop-color="#f2bf3b"/>
      <stop offset="1" stop-color="#6e3e08"/>
